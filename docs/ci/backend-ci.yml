name: Backend CI
on:
  push: { branches: [main, fastapi-migration] }
  pull_request: { branches: [main] }
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env:
      SECRET_KEY: ci-secret-ci-secret-ci-secret-ci-secret
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt pip-audit
      - run: ruff check .
      - name: Migrations apply, roll back, re-apply on PostgreSQL
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - run: python -m pytest -q
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt
