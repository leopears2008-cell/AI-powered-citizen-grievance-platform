services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nivaranai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: nivaranai
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nivaranai"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://nivaranai:${POSTGRES_PASSWORD}@db:5432/nivaranai
    depends_on:
      db: { condition: service_healthy }
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
volumes:
  pgdata:
