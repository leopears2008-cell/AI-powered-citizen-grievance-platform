name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Synchronize Bun lockfile
        run: bun install --lockfile-only

      - name: Install dependencies
        run: bun install

      - name: Type-check
        shell: bash
        run: |
          set +e
          bun run lint > typecheck.log 2>&1
          status=$?
          echo "TYPECHECK_EXIT=$status" >> typecheck.log
          cat typecheck.log
          exit $status

      - name: Upload type-check diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: ignore

      - name: Run tests
        run: bun run test

      - name: Build production assets and server
        run: bun run build
