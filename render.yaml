services:
  - type: web
    name: nivaranai-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:server
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_CLIENT
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: GRIEVANCE_STORAGE_BUCKET
        value: grievance-evidence
      - key: CLAMAV_SCAN_URL
        sync: false
      - key: OBSERVABILITY_WEBHOOK_URL
        sync: false
      - key: NEWS_PROVIDER
        value: newsapi
      - key: NEWS_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
